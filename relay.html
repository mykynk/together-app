<!doctype html><meta charset="utf-8"><title>relay</title><body>relay
<script>
(async () => {
  const lang = new URLSearchParams(location.search).get('lang') || 'tr';
  const out = [];
  for (let i = 1; i <= 9; i++) {
    const n = String(i).padStart(2, '0');
    const b = await (await fetch(`shots/${lang}/${n}.jpg`)).blob();
    out.push({ name: `together-${lang}-${n}.jpg`, blob: b });
  }
  if (window.opener) window.opener.postMessage({ relay: out }, 'https://appstoreconnect.apple.com');
  document.body.textContent = 'sent ' + out.length;
})();
</script>
